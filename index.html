<!doctype html>
<!-- Lang -->
<html lang="es">
  <!-- Head -->
  <head>
    <!-- Metadata -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="theme-color"
      content="#0f172a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)"
    />
    <meta name="author" content="Bryan Espinoza" />
    <meta
      name="description"
      content="Este es un proyecto para practicar mi nivel de Html, Css y Js con herramientas como git, github y Warp"
    />
    <meta name="keywords" content="ToDo, 14BryanEspinoza, Practica" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <!-- Css -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Script -->
    <script src="js/main.js" defer></script>
    <!-- Icon -->
    <link rel="shortcut icon" href="assets/icon.png" type="image/png" />
    <!--Title -->
    <title>ToDo App</title>
  </head>

  <!-- Body -->
  <body>
    <a href="#main" class="skip-link">Saltar al contenido principal</a>
    <div class="bg-gradient"></div>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <button
          id="themeToggle"
          class="header__toggle"
          type="button"
          aria-label="Cambiar a modo claro"
        >
          <svg
            class="icon icon--sun"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            ></path>
          </svg>
          <svg
            class="icon icon--moon"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <h1 class="header__title">ToDo App</h1>
        <time id="date" class="header__date" datetime="">00-00-00</time>
      </header>

      <!-- Stats Section -->
      <section class="stats">
        <div class="stats__item">
          <span id="totalTasks">0</span>
          <p>Totales</p>
        </div>
        <div class="stats__item">
          <span id="completedTasks">0</span>
          <p>Hechas</p>
        </div>
        <div class="stats__item">
          <span id="pendingTasks">0</span>
          <p>Pendientes</p>
        </div>
      </section>

      <div
        class="stats__progress"
        id="progressBar"
        role="progressbar"
        aria-label="Progreso de tareas completadas"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span id="progressFill" class="stats__progress-fill"></span>
      </div>

      <!-- Main -->
      <main class="main glass" id="main">
        <!-- Input Task -->
        <form action="#" id="formTask" class="main__form">
          <label for="task" class="sr-only">Nueva tarea</label>
          <input
            type="text"
            id="task"
            class="main__input"
            placeholder="Agregar Nueva Tarea..."
            minlength="5"
            maxlength="99"
            required
          />
          <button type="submit" class="main__button" aria-label="Agregar tarea">
            +
          </button>
        </form>

        <!-- Filters Bar -->
        <div class="filters">
          <button class="filters__btn filters__btn--active" data-filter="all">
            Todas
          </button>
          <button class="filters__btn" data-filter="active">Pendientes</button>
          <button class="filters__btn" data-filter="completed">Hechas</button>
          <button id="clearCompleted" class="filters__btn filters__btn--clear">
            Limpiar
          </button>
        </div>

        <!-- Task View -->
        <ul id="taskView" class="main__taskView"></ul>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer__link">
          <a
            href="https://github.com/14BryanEspinoza"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
          <a
            href="https://www.linkedin.com/in/14bryanespinoza/"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
        </div>
        <p class="footer__text">Copyright &copy; 2026 - 14BryanEspinoza</p>
      </footer>
    </div>
  </body>
</html>
